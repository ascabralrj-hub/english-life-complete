<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09111f"><link rel="manifest" href="manifest.json">
<title>English Life • Complete</title>
<style>
:root{--bg:#09111f;--card:#111d30;--card2:#17263d;--line:#2b3e59;--t:#f5f7fb;--m:#aebbd0;--g:#48d487;--r:#ff6d7a;--y:#ffd166}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#08101c,#102039);color:var(--t);font:15px system-ui,sans-serif}.wrap{max-width:820px;margin:auto;padding:14px 14px 90px}
header{position:sticky;top:0;z-index:5;background:#09111fee;border-bottom:1px solid var(--line)}h1{margin:0;font-size:25px}.sub,.muted{color:var(--m)}nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0 15px}
button{font:inherit}.nav,.btn{background:#17263d;color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;font-weight:700;cursor:pointer}.nav{font-size:12px}.nav.active{background:var(--g);color:#06130b}
.card{background:linear-gradient(145deg,var(--card),#0e192a);border:1px solid var(--line);border-radius:18px;padding:15px;margin:11px 0}.hero{background:linear-gradient(135deg,#123d2a,#122a45)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:22px}.small{font-size:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.progress{height:9px;background:#26364d;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--g)}
.tag,.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#20314a;color:#c5d8f0;font-size:11px}.done{background:#103d29;color:#8ef0b4}.lesson{cursor:pointer}.lesson:hover{border-color:#56749c}.options{display:grid;gap:9px;margin-top:15px}.option{text-align:left;background:#17263d;color:#fff;border:1px solid #38506e;border-radius:13px;padding:13px;cursor:pointer}.option.correct{background:#103d29;border-color:var(--g)}.option.wrong{background:#401d28;border-color:var(--r)}
input,select{width:100%;background:#0c1728;color:#fff;border:1px solid #334a68;border-radius:12px;padding:11px}.badge{padding:12px;border:1px solid var(--line);border-radius:14px;background:#16253a;margin:7px 0}.locked{opacity:.4}.toast{position:fixed;z-index:20;bottom:75px;left:50%;transform:translateX(-50%);padding:11px 15px;border-radius:12px;background:#111d30;border:1px solid #526985;display:none}
</style></head><body>
<header><div class="wrap" style="padding-bottom:8px"><h1>🇺🇸 English Life <span class="pill">COMPLETE</span></h1><div class="sub">Curso completo • Inteligente • Conversação • Gamificação • Fluência</div></div></header>
<div class="wrap"><nav>
<button class="nav active" data-p="home">🏠 Início</button><button class="nav" data-p="course">📚 Curso</button><button class="nav" data-p="smart">🧠 Smart</button><button class="nav" data-p="talk">🗣️ Falar</button><button class="nav" data-p="more">🏆 Mais</button>
</nav><main id="app"></main></div><div id="toast" class="toast"></div>
<script>
const LEVELS=[
["A1","Descoberta","Comece a se comunicar",[
["a1-1","Apresentações","What's your name?","My name is Daniel.","I am name Daniel.","Daniel my name.","my name","meu nome"],
["a1-2","Origem","Where are you from?","I'm from Brazil.","I from Brazil.","I am Brazil.","from Brazil","do Brasil"],
["a1-3","Como está?","How are you?","I'm very well, thank you.","I have very good.","I very am well.","very well","muito bem"],
["a1-4","Despedidas","Como dizer 'até amanhã'?","See you tomorrow!","See you yesterday!","See tomorrow you!","see you tomorrow","até amanhã"],
["a1-5","Idade","How old are you?","I'm forty-five years old.","I have forty-five years.","I am forty-five.","forty-five years old","quarenta e cinco anos"],
["a1-6","Família","How many children do you have?","I have one son.","I am one son.","I have a son one.","one son","um filho"]]],
["A2","Básico","Vida cotidiana",[
["a2-1","Casa","Como dizer 'minha casa'?","my house","mine house","my home house","my house","minha casa"],
["a2-2","Rotina","What time do you wake up?","I wake up at seven.","I wake at seven up.","I am wake seven.","wake up","acordar"],
["a2-3","Restaurante","Como pedir água educadamente?","I'd like some water, please.","Give water now.","I want water please me.","some water","um pouco de água"],
["a2-4","Compras","Como perguntar o preço?","How much is it?","How many is it?","How price it?","how much","quanto custa"],
["a2-5","Direções","Você precisa do banheiro. O que pergunta?","Where is the bathroom?","What is bathroom?","Where are bathroom?","where is","onde fica"],
["a2-6","Transporte","Como pedir um táxi?","Could you call a taxi, please?","You call taxi me.","Call me a taxi now.","call a taxi","chamar um táxi"],
["a2-7","Horário","What time is the meeting?","It's at three o'clock.","It has three hours.","Three is the time.","at three o'clock","às três horas"]]],
["B1","Intermediário","Comunicação funcional",[
["b1-1","Hotel","O que dizer na recepção?","I'd like to check in.","I like check inside.","I am checking hotel.","check in","fazer check-in"],
["b1-2","Aeroporto","Onde fica o portão 12?","Where is gate twelve?","Where gate is twelve?","What gate twelve?","gate","portão"],
["b1-3","Trabalho","Fale sobre sua reunião.","I have a meeting at nine.","I do a meeting nine.","I have meeting in nine.","meeting","reunião"],
["b1-4","Opinião","Dê uma opinião.","I think it's a good idea.","I think is good idea.","I am thinking a good.","I think","eu acho"],
["b1-5","Ajuda","Peça ajuda educadamente.","Could you help me, please?","Can you helping me please?","You help me now?","could you help me","você poderia me ajudar"],
["b1-6","Profissão","Pergunte a profissão.","What do you do for a living?","What you do alive?","What are you making?","for a living","profissionalmente"],
["b1-7","Experiência","O que você fez ontem?","I went to work.","I go to work yesterday.","I have went work.","went to work","fui ao trabalho"]]],
["B2","Intermediário alto","Conversa e argumentação",[
["b2-1","Experiência","Ação que continua até hoje.","I've been working here for three years.","I work here since three years.","I am work here three years.","I've been working","venho trabalhando"],
["b2-2","Planos","Plano para o próximo mês.","I'm going to travel next month.","I going travel next month.","I am travel next month.","next month","próximo mês"],
["b2-3","Concordância","Concorde fortemente.","I completely agree with you.","I agree completely you.","I am agree with you.","I completely agree","concordo completamente"],
["b2-4","Causa","Introduza o motivo principal.","The main reason is that...","The reason main is...","Is main reason because...","main reason","principal motivo"],
["b2-5","Hipótese","Situação hipotética.","If I had more time, I'd travel.","If I have more time yesterday.","If more time I travel.","if I had more time","se eu tivesse mais tempo"],
["b2-6","Naturalidade","Diga que algo faz sentido.","That makes perfect sense.","That does perfect sense.","It makes sense perfect.","makes perfect sense","faz todo sentido"]]],
["C1","Avançado","Inglês profissional",[
["c1-1","Reunião","Introduza um ponto.","I'd like to raise a point.","I like raise point.","I want raising one.","raise a point","levantar um ponto"],
["c1-2","Negociação","Proponha um meio-termo.","Could we find a compromise?","Can we find compromise a?","We can compromise finding?","find a compromise","encontrar um meio-termo"],
["c1-3","Apresentação","Resuma os pontos principais.","Let me summarize the key points.","Let summarize me points.","I summarize the key pointings.","key points","pontos principais"],
["c1-4","Email","Acompanhe um assunto profissional.","I am writing to follow up on...","I write following up...","I am writing follow...","follow up on","dar continuidade a"],
["c1-5","Persuasão","Apresente uma vantagem.","One major advantage is that...","One advantage major...","The major is advantage...","major advantage","grande vantagem"],
["c1-6","Diplomacia","Discorde com respeito.","I see your point, but I have some concerns.","You are wrong about this.","I disagree you totally.","I see your point","entendo seu ponto"]]],
["C2","Fluência","Precisão e nuance",[
["c2-1","Nuance","Reconheça outra perspectiva.","Having said that, I see your point.","Said having that...","I see your point having.","having said that","dito isso"],
["c2-2","Argumentação","Introduza opinião sofisticada.","From my perspective, the issue is more complex.","In my perspective is complex more.","My point perspective is...","from my perspective","na minha perspectiva"],
["c2-3","Consideração","Introduza algo importante.","It's worth bearing in mind that...","It's worthy bear mind...","It worths in mind...","worth bearing in mind","vale a pena ter em mente"],
["c2-4","Concessão","Conceda um ponto.","To some extent, I agree.","To some extent, I am agree.","I agree some extent to.","to some extent","até certo ponto"],
["c2-5","Precisão","Faça uma ressalva.","That depends largely on the circumstances.","That depends large the circumstances.","It depends largely circumstances the.","depends largely on","depende em grande parte de"]]]
];

const DIALOGUES=[
["Restaurante",[["Atendente","Good evening. Do you have a reservation?"],["Você","No, but we'd like a table for two, please."],["Atendente","Would you like to sit inside or outside?"],["Você","Outside, if possible."]]],
["Hotel",[["Recepcionista","Good afternoon. How can I help you?"],["Você","I'd like to check in. The reservation is under Cabral."],["Recepcionista","May I see your passport, please?"],["Você","Sure. Here you are."]]],
["Trabalho",[["Colega","Are you available for a quick meeting?"],["Você","Yes. What time works for you?"],["Colega","How about three o'clock?"],["Você","That works for me."]]],
["Aeroporto",[["Funcionário","Can I help you?"],["Você","Yes. Where is gate twelve?"],["Funcionário","It's on the upper level, near the coffee shop."],["Você","Thank you. I appreciate it."]]],
["Conversa",[["Pessoa","What do you do for a living?"],["Você","I work in engineering. What about you?"],["Pessoa","I work in finance."],["Você","That's interesting. How long have you worked there?"]]]
];
const CH=[
["Restaurante","Peça uma mesa para duas pessoas.","I'd like a table for two, please."],
["Hotel","Faça o check-in.","I'd like to check in."],
["Trabalho","Peça ajuda educadamente.","Could you help me, please?"],
["Aeroporto","Pergunte pelo portão 12.","Where is gate twelve?"],
["Opinião","Dê uma opinião simples.","I think it's a good idea."],
["Negociação","Proponha um meio-termo.","Could we find a compromise?"],
["Conversação","Pergunte a profissão.","What do you do for a living?"]];
const BADGES=[
["first","🎯","Primeiro passo","1 lição",s=>s.done.length>=1],
["ten","📚","Estudante","10 lições",s=>s.done.length>=10],
["words","📖","Colecionador","20 expressões",s=>s.dict.length>=20],
["talk","🗣️","Conversador","3 diálogos",s=>s.dialogues>=3],
["daily","🔥","Constância","3 desafios",s=>s.dailyTotal>=3],
["xp","⭐","Mil XP","1000 XP",s=>s.xp>=1000],
["advanced","🚀","Avançado","1 lição C1",s=>s.done.some(x=>x.startsWith("c1-"))],
["fluency","🏆","Fluência","1 lição C2",s=>s.done.some(x=>x.startsWith("c2-"))]
];
const KEY="english-life-complete-v1";
let S=JSON.parse(localStorage.getItem(KEY)||"null")||{xp:0,streak:0,last:"",done:[],wrong:[],dict:[],attempts:0,correct:0,voice:0,voiceOK:0,dailyDay:"",daily:0,dailyDone:false,dialogues:0,dialogue:0,page:"home",current:null};

const esc=x=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const all=()=>LEVELS.flatMap(l=>l[3].map(u=>({level:l[0],name:l[1],desc:l[2],u})));
const find=id=>all().find(x=>x.u[0]===id);
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function toast(t){let x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.t);window.t=setTimeout(()=>x.style.display="none",1700)}
function speak(t){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.88;speechSynthesis.speak(u)}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function touch(){let d=today();if(S.last!==d){let z=new Date();z.setDate(z.getDate()-1);let y=z.toISOString().slice(0,10);S.streak=S.last===y?S.streak+1:1;S.last=d}}
function xp(n){touch();S.xp+=n;save();toast("+"+n+" XP")}
function sync(){let d=today();if(S.dailyDay!==d){S.dailyDay=d;S.daily=(new Date().getDate()+new Date().getMonth())%CH.length;S.dailyDone=false;save()}}
function rank(){let a=[["Iniciante",0],["A1",150],["A2",450],["B1",900],["B2",1500],["C1",2300],["C2",3500],["Fluente",5000]],c=a[0],n=a[1];for(let i=0;i<a.length;i++){if(S.xp>=a[i][1])c=a[i];if(S.xp<a[i][1]){n=a[i];break}}return[c,n]}
function go(p){S.current=null;S.page=p;save();render()}
document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.p));

function home(){sync();let r=rank(),pct=Math.min(100,Math.round((S.xp-r[0][1])/Math.max(1,r[1][1]-r[0][1])*100)),acc=S.attempts?Math.round(S.correct/S.attempts*100):0;
return `<div class="card hero"><div class="row"><div><div class="muted">Nível atual</div><h2 style="margin:4px 0">${r[0][0]}</h2><b>${S.xp} XP</b></div><div style="font-size:42px">🏆</div></div><div class="progress" style="margin-top:13px"><i style="width:${pct}%"></i></div><div class="small muted">${r[1][0]} • ${Math.max(0,r[1][1]-S.xp)} XP restantes</div></div>
<div class="grid"><div class="stat">🔥<b>${S.streak}</b><span class="muted">dias</span></div><div class="stat">📚<b>${S.done.length}/${all().length}</b><span class="muted">lições</span></div><div class="stat">📖<b>${S.dict.length}</b><span class="muted">expressões</span></div><div class="stat">🎯<b>${acc}%</b><span class="muted">acerto</span></div></div>
<div class="card"><div class="row"><div><h3 style="margin:0">🎯 Desafio diário</h3><div class="muted">${CH[S.daily][0]}</div></div><span>${S.dailyDone?"✅ Feito":"+25 XP"}</span></div><p>${CH[S.daily][1]}</p><button class="btn" onclick="daily()" ${S.dailyDone?"disabled":""}>${S.dailyDone?"Concluído":"Começar"}</button></div>
<div class="grid"><div class="card"><h3>🧠 Smart</h3><p class="muted">Revisão baseada nos seus erros.</p><button class="btn" onclick="go('smart')">Revisar</button></div><div class="card"><h3>🗣️ Conversação</h3><p class="muted">Situações reais e voz.</p><button class="btn" onclick="go('talk')">Praticar</button></div></div>
<div class="card"><h3>🚀 Jornada completa</h3><p class="muted">A1 → A2 → B1 → B2 → C1 → C2 → Fluência. Tudo integrado nesta versão.</p><button class="btn" onclick="go('course')">Abrir curso</button></div>`}

function course(){return `<div class="card"><h2 style="margin:0">📚 Curso completo</h2><p class="muted">Cada lição trabalha uma situação real, expressão principal e alternativas. Acertos geram XP e vocabulário.</p></div>`+LEVELS.map(l=>`<section class="card"><span class="tag">${l[0]}</span><h2 style="margin:7px 0">${l[1]}</h2><p class="muted">${l[2]}</p>${l[3].map(u=>`<div class="card lesson" onclick="start('${u[0]}')"><div class="row"><div><b>${u[1]}</b><div class="small muted">${u[2]}</div></div><span class="tag ${S.done.includes(u[0])?'done':''}">${S.done.includes(u[0])?'✓':'10 XP'}</span></div></div>`).join("")}</section>`).join("")}

function start(id){S.current={type:"unit",id,attempted:false};lesson()}
function daily(){sync();S.current={type:"daily",attempted:false};lesson()}
function lesson(){let c=S.current,d=c.type==="daily",x=d?null:find(c.id),q=d?CH[S.daily]:x.u,question=d?q[1]:q[2],correct=d?q[2]:q[3],opts=d?shuffle([correct,"Can I have two tables?","I want table for two.","Give me a table."]):shuffle([correct,q[4],q[5],"Try another expression."]);
document.getElementById("app").innerHTML=`<div class="card"><button class="btn" onclick="go('${d?'home':'course'}')">← Voltar</button><div style="margin-top:15px"><span class="tag">${d?'DESAFIO DIÁRIO':x.level}</span><h2>${esc(d?q[0]:x.u[1])}</h2><p class="muted">${esc(question)}</p><button class="btn" onclick="speak(${JSON.stringify(correct)})">🔊 Ouvir inglês</button></div><div class="options">${opts.map(o=>`<button class="option" onclick="answer(this,${JSON.stringify(o)},${JSON.stringify(correct)})">${esc(o)}</button>`).join("")}</div><div id="fb"></div><hr style="border-color:#2b3e59"><button class="btn" onclick="voice(${JSON.stringify(correct)})">🎤 Responder por voz</button><div id="v" class="small muted" style="margin-top:8px">Você pode responder por voz ou pelas alternativas.</div></div>`}
function answer(el,val,correct){if(S.current.attempted)return;S.current.attempted=true;S.attempts++;if(val===correct){S.correct++;el.classList.add("correct");if(S.current.type==="daily"){S.dailyDone=true;S.daily++;xp(25)}else{let x=find(S.current.id);if(!S.done.includes(S.current.id))S.done.push(S.current.id);if(x&&!S.dict.some(w=>w.en===x.u[6]))S.dict.push({en:x.u[6],pt:x.u[7],ex:x.u[3],mastery:1});xp(10)}document.getElementById("fb").innerHTML=`<div class="card"><b>✅ Excelente!</b><p>Você acertou. O progresso e o vocabulário foram atualizados.</p><button class="btn" onclick="${S.current.type==='daily'?"go('home')":"next()"}">${S.current.type==='daily'?"Concluir":"Próxima lição →"}</button></div>`}else{el.classList.add("wrong");S.wrong.push(S.current.id||"daily");save();document.getElementById("fb").innerHTML=`<div class="card"><b>❌ Ainda não.</b><p>Não vou revelar a resposta. Essa atividade entrou no Smart Review.</p><button class="btn" onclick="go('smart')">Revisar depois</button></div>`}}
function next(){let a=all(),i=a.findIndex(x=>x.u[0]===S.current.id);a[i+1]?start(a[i+1].u[0]):go("course")}
function voice(target){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById("v").textContent="Reconhecimento não disponível neste navegador. Use as alternativas.";return}let r=new R();r.lang="en-US";r.interimResults=false;r.onresult=e=>{let said=e.results[0][0].transcript;let n=s=>s.toLowerCase().replace(/[.,!?']/g,"").trim();let ok=n(said)===n(target);S.voice++;if(ok)S.voiceOK++;document.getElementById("v").textContent=(ok?"✅ Muito próximo! ":"📝 Você disse: ")+said;save()};r.onerror=()=>document.getElementById("v").textContent="Não consegui reconhecer. Tente novamente.";r.start()}

function smart(){let wrong=[...new Set(S.wrong)].map(find).filter(Boolean);let weak=S.dict.filter(x=>x.mastery<3);return `<div class="card"><h2>🧠 Inglês Inteligente</h2><p class="muted">O sistema usa seus erros, vocabulário e desempenho para orientar a revisão.</p><div class="grid"><div class="stat">❌<b>${wrong.length}</b><span class="muted">pendências</span></div><div class="stat">📖<b>${weak.length}</b><span class="muted">palavras fracas</span></div></div></div><div class="card"><h3>🔁 Revisar erros</h3>${wrong.length?wrong.map(x=>`<div class="card lesson" onclick="start('${x.u[0]}')"><b>${x.u[1]}</b><div class="muted">${x.u[2]}</div></div>`).join(""):"<p class='muted'>Nenhuma pendência. Continue estudando!</p>"}</div><div class="card"><h3>📖 Vocabulário em treinamento</h3>${weak.length?weak.map(x=>`<div class="row"><div><b>${esc(x.en)}</b><div class="small muted">${esc(x.pt)}</div></div><button class="btn" onclick="speak(${JSON.stringify(x.en)})">🔊</button></div>`).join(""):"<p class='muted'>Complete mais lições para criar seu vocabulário.</p>"}</div>`}

function talk(){let d=DIALOGUES[S.dialogue%DIALOGUES.length];return `<div class="card"><h2>🗣️ Laboratório de Conversação</h2><p class="muted">Ouça, repita e pratique situações reais.</p><select onchange="S.dialogue=+this.value;save();render()">${DIALOGUES.map((x,i)=>`<option value="${i}" ${i===S.dialogue?'selected':''}>${x[0]}</option>`).join("")}</select></div><div class="card"><h2>${d[0]}</h2>${d[1].map(x=>`<div class="card"><div class="small muted">${x[0]}</div><p>${esc(x[1])}</p><button class="btn" onclick="speak(${JSON.stringify(x[1])})">🔊 Ouvir</button>${x[0]==='Você'?` <button class="btn" onclick="repeat(this,${JSON.stringify(x[1])})">🎤 Repetir</button>`:""}</div>`).join("")}<button class="btn" onclick="finishTalk()">✅ Concluir diálogo (+40 XP)</button></div><div class="card"><b>💡 Modo de treino</b><p class="muted">Primeiro ouça. Depois tente falar sem olhar. Na terceira rodada, tente responder de memória.</p></div>`}
function repeat(btn,target){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("Voz indisponível");return}let r=new R();r.lang="en-US";r.onresult=e=>{let a=e.results[0][0].transcript.toLowerCase().replace(/[.,!?']/g,""),b=target.toLowerCase().replace(/[.,!?']/g,"");btn.textContent=a===b?"✅ Ótimo":"🎤 Tentar novamente"};r.start()}
function finishTalk(){S.dialogues++;xp(40);render()}

function more(){let acc=S.attempts?Math.round(S.correct/S.attempts*100):0,va=S.voice?Math.round(S.voiceOK/S.voice*100):0;return `<div class="card"><h2>🏆 Gamificação</h2><div class="grid"><div class="stat">⭐<b>${S.xp}</b><span>XP total</span></div><div class="stat">🔥<b>${S.streak}</b><span>dias seguidos</span></div><div class="stat">🎯<b>${acc}%</b><span>questões</span></div><div class="stat">🎤<b>${va}%</b><span>voz</span></div></div></div><div class="card"><h3>🎖️ Conquistas</h3>${BADGES.map(b=>{let ok=b[4](S);return `<div class="badge ${ok?'':'locked'}"><div class="row"><span style="font-size:25px">${b[1]}</span><div style="flex:1"><b>${b[2]}</b><div class="small muted">${b[3]}</div></div><span>${ok?'✓':'🔒'}</span></div></div>`}).join("")}</div><div class="card"><h3>📖 Dicionário</h3><p class="muted">${S.dict.length} expressões acumuladas.</p><button class="btn" onclick="dict()">Abrir dicionário</button></div><div class="card"><h3>💾 Meu progresso</h3><button class="btn" onclick="exportData()">Exportar</button> <button class="btn" onclick="resetData()">Reiniciar</button></div>`}
function dict(){S.page="dict";document.getElementById("app").innerHTML=`<div class="card"><button class="btn" onclick="go('more')">← Voltar</button><h2>📖 Meu dicionário</h2>${S.dict.length?S.dict.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.en)}</b><div>${esc(x.pt)}</div><div class="small muted">${esc(x.ex)}</div></div><button class="btn" onclick="speak(${JSON.stringify(x.en)})">🔊</button></div></div>`).join(""):"<div class='hero'>Seu dicionário está vazio. Complete lições para preenchê-lo.</div>"}</div>`}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="english-life-progresso.json";a.click()}
function resetData(){if(confirm("Apagar todo o progresso?")){localStorage.removeItem(KEY);location.reload()}}
function render(){document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.p===S.page));if(S.page==="dict")dict();else document.getElementById("app").innerHTML=({home,course,smart,talk,more}[S.page]||home)()}
sync();render();
</script></body></html>
