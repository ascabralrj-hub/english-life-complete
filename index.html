function speakText(t,statusId){const status=statusId?document.getElementById(statusId):null;if(!("speechSynthesis" in window)||!("SpeechSynthesisUtterance" in window)){if(status)status.textContent="Este navegador não oferece síntese de voz. Atualize o Chrome e confira a saída de áudio do Android.";else toast("Síntese de voz não disponível neste navegador.");return}const synth=window.speechSynthesis;try{synth.cancel();const run=()=>{const u=new SpeechSynthesisUtterance(String(t));u.lang="en-US";const cfg=JSON.parse(localStorage.getItem("el-settings")||"{}");u.rate=Number(cfg.rate)||0.88;const voices=synth.getVoices();const v=voices.find(x=>/^en(-|_)/i.test(x.lang)&&/US|United States/i.test(x.lang+" "+x.name))||voices.find(x=>/^en(-|_)/i.test(x.lang));if(v)u.voice=v;u.onstart=()=>{if(status)status.textContent="Áudio iniciado. Se não ouvir, aumente o volume de mídia e confira a saída de som do celular."};u.onerror=e=>{if(status)status.textContent="Falha na reprodução ("+(e.error||"desconhecida")+"). Confira o mecanismo de síntese de voz do Android e o volume de mídia.";else toast("Falha no áudio. Confira o volume e a síntese de voz do Android.")};u.onend=()=>{if(status)status.textContent="Teste de áudio concluído."};synth.speak(u);setTimeout(()=>{if(status&&synth.speaking)status.textContent="Reproduzindo áudio em inglês…"},500)};if(synth.getVoices().length){run()}else{let done=false;const go=()=>{if(done)return;done=true;synth.onvoiceschanged=null;run()};synth.onvoiceschanged=go;setTimeout(go,1200)}}catch(e){if(status)status.textContent="Não foi possível reproduzir áudio: "+e.message;else toast("Não foi possível reproduzir áudio.")}}

document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.p));

function home(){sync();let r=rank(),pct=Math.min(100,Math.round((S.xp-r[0][1])/Math.max(1,r[1][1]-r[0][1])*100)),acc=S.attempts?Math.round(S.correct/S.attempts*100):0;
return `<div class="card hero"><div class="row"><div><div class="muted">Nível atual</div><h2 style="margin:4px 0">${r[0][0]}</h2><b>${S.xp} XP</b></div><div style="font-size:42px">🏆</div></div><div class="progress" style="margin-top:13px"><i style="width:${pct}%"></i></div><div class="small muted">${r[1][0]} • ${Math.max(0,r[1][1]-S.xp)} XP restantes</div></div>
<div class="grid"><div class="stat">🔥<b>${S.streak}</b><span class="muted">dias</span></div><div class="stat">📚<b>${S.done.length}/${all().length}</b><span class="muted">lições</span></div><div class="stat">📖<b>${S.dict.length}</b><span class="muted">expressões</span></div><div class="stat">🎯<b>${acc}%</b><span class="muted">acerto</span></div></div>
<div class="card"><div class="row"><div><h3 style="margin:0">🎯 Desafio diário</h3><div class="muted">${CH[S.daily][0]}</div></div><span>${S.dailyDone?"✅ Feito":"+25 XP"}</span></div><p>${CH[S.daily][1]}</p><button class="btn" onclick="daily()" ${S.dailyDone?"disabled":""}>${S.dailyDone?"Concluído":"Começar"}</button></div>
<div class="grid"><div class="card"><h3>🧠 Smart</h3><p class="muted">Revisão baseada nos seus erros.</p><button class="btn" onclick="go('smart')">Revisar</button></div><div class="card"><h3>🗣️ Conversação</h3><p class="muted">Situações reais e voz.</p><button class="btn" onclick="go('talk')">Praticar</button></div></div>
<div class="card"><h3>🚀 Jornada completa</h3><p class="muted">A1 → A2 → B1 → B2 → C1 → C2 → Fluência. Tudo integrado nesta versão.</p><button class="btn" onclick="go('course')">Abrir curso</button></div>`}

function course(){return `<div class="card"><h2 style="margin:0">📚 Curso completo</h2><p class="muted">Curso anual: 52 semanas, 4 fases e 260 lições (5 por semana). Estude de segunda a sexta; use o fim de semana para revisão e conversação.</p><div class="grid"><div class="stat">📅<b>52</b><span>semanas</span></div><div class="stat">📚<b>260</b><span>lições</span></div><div class="stat">🧭<b>4</b><span>fases</span></div><div class="stat">🎯<b>5</b><span>lições/semana</span></div></div></div>`+LEVELS.map(l=>`<section class="card"><span class="tag">${l[0]}</span><h2 style="margin:7px 0">${l[1]}</h2><p class="muted">${l[2]}</p>${l[3].map(u=>`<div class="card lesson" onclick="start('${u[0]}')"><div class="row"><div><b>${u[1]}</b><div class="small muted">${u[2]}</div></div><span class="tag ${S.done.includes(u[0])?'done':''}">${S.done.includes(u[0])?'✓':'10 XP'}</span></div></div>`).join("")}</section>`).join("")}

function start(id){S.current={type:"unit",id,attempted:false};lesson()}
function daily(){sync();S.current={type:"daily",attempted:false};lesson()}
function lesson(){let c=S.current,d=c.type==="daily",x=d?null:find(c.id),q=d?CH[S.daily]:x.u,question=d?q[1]:q[2],correct=d?q[2]:q[3],opts=d?shuffle([correct,"Can I have two tables?","I want table for two.","Give me a table."]):shuffle([correct,q[4],q[5],"Try another expression."]);
document.getElementById("app").innerHTML=`<div class="card"><button class="btn" onclick="go('${d?'home':'course'}')">← Voltar</button><div style="margin-top:15px"><span class="tag">${d?'DESAFIO DIÁRIO':x.level}</span><h2>${esc(d?q[0]:x.u[1])}</h2><p class="muted">${esc(question)}</p><button class="btn" onclick="speak(decodeURIComponent('${arg(correct)}'))">🔊 Ouvir inglês</button></div><div class="options">${opts.map(o=>`<button class="option" onclick="answer(this,decodeURIComponent('${arg(o)}'),decodeURIComponent('${arg(correct)}'))">${esc(o)}</button>`).join("")}</div><div id="fb"></div><hr style="border-color:#2b3e59"><button class="btn" onclick="voice(decodeURIComponent('${arg(correct)}'))">🎤 Responder por voz</button><div id="v" class="small muted" style="margin-top:8px">Você pode responder por voz ou pelas alternativas.</div></div>`}
function answer(el,val,correct){if(S.current.attempted)return;S.current.attempted=true;S.attempts++;if(val===correct){S.correct++;el.classList.add("correct");if(S.current.type==="daily"){S.dailyDone=true;S.daily++;xp(25)}else{let x=find(S.current.id);if(!S.done.includes(S.current.id))S.done.push(S.current.id);if(x&&!S.dict.some(w=>w.en===x.u[6]))S.dict.push({en:x.u[6],pt:x.u[7],ex:x.u[3],mastery:1});xp(10)}document.getElementById("fb").innerHTML=`<div class="card"><b>✅ Excelente!</b><p>Você acertou. O progresso e o vocabulário foram atualizados.</p><button class="btn" onclick="${S.current.type==='daily'?"go('home')":"next()"}">${S.current.type==='daily'?"Concluir":"Próxima lição →"}</button></div>`}else{el.classList.add("wrong");S.wrong.push(S.current.id||"daily");save();document.getElementById("fb").innerHTML=`<div class="card"><b>❌ Ainda não.</b><p>Não vou revelar a resposta. Essa atividade entrou no Smart Review.</p><button class="btn" onclick="go('smart')">Revisar depois</button></div>`}}
function next(){let a=all(),i=a.findIndex(x=>x.u[0]===S.current.id);a[i+1]?start(a[i+1].u[0]):go("course")}
function voice(target){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){document.getElementById("v").textContent="Reconhecimento não disponível neste navegador. Use as alternativas.";return}let r=new R();r.lang="en-US";r.interimResults=false;r.onresult=e=>{let said=e.results[0][0].transcript;let n=s=>s.toLowerCase().replace(/[.,!?']/g,"").trim();let ok=n(said)===n(target);S.voice++;if(ok)S.voiceOK++;document.getElementById("v").textContent=(ok?"✅ Muito próximo! ":"📝 Você disse: ")+said;save()};r.onerror=()=>document.getElementById("v").textContent="Não consegui reconhecer. Tente novamente.";r.start()}

function smart(){let wrong=[...new Set(S.wrong)].map(find).filter(Boolean);let weak=S.dict.filter(x=>x.mastery<3);return `<div class="card"><h2>🧠 Inglês Inteligente</h2><p class="muted">O sistema usa seus erros, vocabulário e desempenho para orientar a revisão.</p><div class="grid"><div class="stat">❌<b>${wrong.length}</b><span class="muted">pendências</span></div><div class="stat">📖<b>${weak.length}</b><span class="muted">palavras fracas</span></div></div></div><div class="card"><h3>🔁 Revisar erros</h3>${wrong.length?wrong.map(x=>`<div class="card lesson" onclick="start('${x.u[0]}')"><b>${x.u[1]}</b><div class="muted">${x.u[2]}</div></div>`).join(""):"<p class='muted'>Nenhuma pendência. Continue estudando!</p>"}</div><div class="card"><h3>📖 Vocabulário em treinamento</h3>${weak.length?weak.map(x=>`<div class="row"><div><b>${esc(x.en)}</b><div class="small muted">${esc(x.pt)}</div></div><button class="btn" onclick="speak(decodeURIComponent('${arg(x.en)}'))">🔊</button></div>`).join(""):"<p class='muted'>Complete mais lições para criar seu vocabulário.</p>"}</div>`}

function talk(){let d=DIALOGUES[S.dialogue%DIALOGUES.length];return `<div class="card"><h2>🗣️ Laboratório de Conversação</h2><p class="muted">Ouça, repita e pratique situações reais.</p><select onchange="S.dialogue=+this.value;save();render()">${DIALOGUES.map((x,i)=>`<option value="${i}" ${i===S.dialogue?'selected':''}>${x[0]}</option>`).join("")}</select></div><div class="card"><h2>${d[0]}</h2>${d[1].map(x=>`<div class="card"><div class="small muted">${x[0]}</div><p>${esc(x[1])}</p><button class="btn" onclick="speak(decodeURIComponent('${arg(x[1])}'))">🔊 Ouvir</button>${x[0]==='Você'?` <button class="btn" onclick="repeat(this,decodeURIComponent('${arg(x[1])}'))">🎤 Repetir</button>`:""}</div>`).join("")}<button class="btn" onclick="finishTalk()">✅ Concluir diálogo (+40 XP)</button></div><div class="card"><b>💡 Modo de treino</b><p class="muted">Primeiro ouça. Depois tente falar sem olhar. Na terceira rodada, tente responder de memória.</p></div>`}
function repeat(btn,target){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast("Voz indisponível");return}let r=new R();r.lang="en-US";r.onresult=e=>{let a=e.results[0][0].transcript.toLowerCase().replace(/[.,!?']/g,""),b=target.toLowerCase().replace(/[.,!?']/g,"");btn.textContent=a===b?"✅ Ótimo":"🎤 Tentar novamente"};r.start()}
function finishTalk(){S.dialogues++;xp(40);render()}

function more(){let acc=S.attempts?Math.round(S.correct/S.attempts*100):0,va=S.voice?Math.round(S.voiceOK/S.voice*100):0;return `<div class="card"><h2>🏆 Gamificação</h2><div class="grid"><div class="stat">⭐<b>${S.xp}</b><span>XP total</span></div><div class="stat">🔥<b>${S.streak}</b><span>dias seguidos</span></div><div class="stat">🎯<b>${acc}%</b><span>questões</span></div><div class="stat">🎤<b>${va}%</b><span>voz</span></div></div></div><div class="card"><h3>🎖️ Conquistas</h3>${BADGES.map(b=>{let ok=b[4](S);return `<div class="badge ${ok?'':'locked'}"><div class="row"><span style="font-size:25px">${b[1]}</span><div style="flex:1"><b>${b[2]}</b><div class="small muted">${b[3]}</div></div><span>${ok?'✓':'🔒'}</span></div></div>`}).join("")}</div><div class="card"><h3>📖 Dicionário</h3><p class="muted">${S.dict.length} expressões acumuladas.</p><button class="btn" onclick="dict()">Abrir dicionário</button></div><div class="card"><h3>💾 Meu progresso</h3><button class="btn" onclick="exportData()">Exportar</button> <button class="btn" onclick="resetData()">Reiniciar</button></div>`}
function dict(){S.page="dict";document.getElementById("app").innerHTML=`<div class="card"><button class="btn" onclick="go('more')">← Voltar</button><h2>📖 Meu dicionário</h2>${S.dict.length?S.dict.map(x=>`<div class="card"><div class="row"><div><b>${esc(x.en)}</b><div>${esc(x.pt)}</div><div class="small muted">${esc(x.ex)}</div></div><button class="btn" onclick="speak(decodeURIComponent('${arg(x.en)}'))">🔊</button></div></div>`).join(""):"<div class='hero'>Seu dicionário está vazio. Complete lições para preenchê-lo.</div>"}</div>`}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="english-life-progresso.json";a.click()}
function resetData(){if(confirm("Apagar todo o progresso?")){localStorage.removeItem(KEY);location.reload()}}
function settings(){let cfg=JSON.parse(localStorage.getItem("el-settings")||"{}");let rate=cfg.rate||0.88;return `<div class="card"><h2>⚙️ Configurações</h2><p class="muted">Ajuste o áudio e teste o microfone neste aparelho.</p><label for="voiceRate">Velocidade da fala: <b id="rateLabel">${rate.toFixed(2)}x</b></label><input id="voiceRate" type="range" min="0.6" max="1.2" step="0.05" value="${rate}" oninput="document.getElementById('rateLabel').textContent=Number(this.value).toFixed(2)+'x';saveSettings()"><div style="height:12px"></div><button class="btn" onclick="testAudio()">🔊 Testar áudio em inglês</button><div id="audioStatus" class="small muted" style="margin-top:10px">Nenhum teste de áudio iniciado.</div></div><div class="card"><h3>🎤 Reconhecimento de voz</h3><p class="muted">O reconhecimento depende do navegador e pode exigir conexão com a internet.</p><button class="btn" onclick="testMic()">🎙️ Testar microfone</button><div id="micStatus" class="small muted" style="margin-top:10px">Nenhum teste iniciado.</div></div><div class="card"><h3>📱 Se o microfone não funcionar</h3><ol><li>Abra o app pelo Google Chrome, de preferência pelo endereço publicado.</li><li>Toque no cadeado/ícone ao lado do endereço e permita o microfone.</li><li>Nas configurações do Android, permita Microfone para o Chrome.</li><li>Volte e tente novamente.</li></ol><p class="small muted">Se o app estiver aberto como arquivo local ou dentro de um visualizador de ZIP, recursos de voz podem não funcionar.</p></div>`}
function saveSettings(){let el=document.getElementById("voiceRate");if(el)localStorage.setItem("el-settings",JSON.stringify({rate:Number(el.value)}))}
function testAudio(){speakText("Hello! Welcome to English Life. Let's practice English together.","audioStatus")}
function testMic(){let status=document.getElementById("micStatus");if(!window.isSecureContext){status.textContent="A página não está em contexto seguro. Abra o aplicativo pelo endereço HTTPS do GitHub Pages; o arquivo local/visualizador de ZIP pode bloquear o microfone.";return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){status.textContent="Reconhecimento de voz não é compatível com este navegador. Tente a versão atual do Google Chrome no Android; se continuar, use as alternativas de resposta.";return}try{let r=new R();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;r.continuous=false;r.onstart=()=>status.textContent="Ouvindo… diga uma frase curta em inglês agora.";r.onresult=e=>{let heard=e.results&&e.results[0]&&e.results[0][0]?e.results[0][0].transcript:"";status.textContent=heard?"Reconhecido: "+heard:"Nenhuma fala foi reconhecida. Tente novamente em local silencioso."};r.onerror=e=>{let msgs={"not-allowed":"Permissão negada. Autorize Microfone para o Chrome nas configurações do Android e no ícone ao lado do endereço.","service-not-allowed":"O serviço de reconhecimento foi bloqueado. Abra pelo Chrome em HTTPS e confira conexão com a internet.","audio-capture":"Nenhum microfone disponível ou o Android não permitiu acesso.","network":"Falha de rede no serviço de reconhecimento. Confira a internet e tente novamente.","no-speech":"Não detectei fala. Fale logo após tocar no botão e tente novamente.","aborted":"O reconhecimento foi interrompido. Tente novamente."};status.textContent="Falha: "+(msgs[e.error]||e.error||"erro desconhecido")};r.onend=()=>{};r.start()}catch(e){status.textContent="Não foi possível iniciar o microfone. Confirme HTTPS e a permissão de microfone do Chrome. Detalhe: "+e.message}}
function render(){document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.p===S.page));if(S.page==="dict")dict();else document.getElementById("app").innerHTML=({home,course,smart,talk,more,settings}[S.page]||home)()}
sync();render();
</script></body></html>
